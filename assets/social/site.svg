<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Nebuló &#x2014; Maghiar&#x103;, pas cu pas</title>
  <desc id="description">Lec&#x21B;ii &#x219;i resurse de limba maghiar&#x103; pentru vorbitori de rom&#xE2;n&#x103;.</desc>
  <rect width="1200" height="630" fill="#f4f7f5"/>
  <rect x="805" y="55" width="340" height="520" rx="28" fill="#e0ede4"/>
  <g transform="translate(70 65) scale(1.21875)">
    <path d="M32 24c-1-6 0-10 3-14" fill="none" stroke="#69432d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M34 18C35 9 43 5 52 5c-3 9-9 15-18 13Z" fill="#24634c"/>
    <path d="M32 25C22 18 11 22 9 33 6 45 17 60 25 59c3 0 5-2 7-2s5 2 8 2c9 1 19-15 16-27-2-11-14-14-24-7Z" fill="#b52b36"/>
  </g>
  <text x="170" y="117" fill="#192f2b" font-family="Arial,sans-serif" font-size="39" font-weight="700">Nebuló</text>
  <text x="70" y="265" fill="#192f2b" font-family="Georgia,serif" font-size="76">&#xCE;nva&#x21B;&#x103; maghiara.</text>
  <text x="70" y="363" fill="#24634c" font-family="Georgia,serif" font-size="81" font-style="italic">Pas cu pas.</text>
  <text x="70" y="450" fill="#51625c" font-family="Arial,sans-serif" font-size="28">Lec&#x21B;ii, dialoguri &#x219;i resurse</text>
  <text x="70" y="492" fill="#51625c" font-family="Arial,sans-serif" font-size="28">pentru vorbitori de rom&#xE2;n&#x103;.</text>
  <text x="848" y="285" fill="#192f2b" font-family="Georgia,serif" font-size="85" font-style="italic">Szia!</text>
  <text x="850" y="345" fill="#24634c" font-family="Arial,sans-serif" font-size="34">Salut!</text>
  <path d="M850 395h235" stroke="#b1cbb9" stroke-width="2"/>
  <text x="850" y="449" fill="#51625c" font-family="Arial,sans-serif" font-size="22">Un cuv&#xE2;nt. Un &#xEE;nceput.</text>
</svg>
